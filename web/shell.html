<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0D3B2E">
<meta name="robots" content="noindex">
<title>__TITLE__</title>
<style>
:root {
  --frame-w: min(100vw, 430px);
  --rpx: calc(var(--frame-w) / 750);
  --nav-h: 44px;
  --tab-h: calc(50px + env(safe-area-inset-bottom));
}
* { -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #E9E6DE; }
body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }

#app {
  position: relative; width: var(--frame-w); height: 100%; height: 100dvh;
  margin: 0 auto; overflow: hidden; background: #F5F3EE;
}
@media (min-width: 520px) and (min-height: 700px) {
  body { display: flex; align-items: center; justify-content: center; }
  #app { height: min(100dvh - 48px, 900px); border-radius: 28px; box-shadow: 0 24px 80px rgba(13, 59, 46, 0.18); }
}

/* 导航栏 */
#nav {
  position: absolute; top: 0; left: 0; right: 0; height: var(--nav-h); z-index: 20;
  background: #0D3B2E; color: #fff; display: flex; align-items: center; justify-content: center;
}
#nav-title { font-size: 17px; font-weight: 600; max-width: 62%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nav-back {
  position: absolute; left: 0; top: 0; width: 48px; height: var(--nav-h); display: none;
  align-items: center; justify-content: center; cursor: pointer;
}
#nav-back.show { display: flex; }
#nav-back::before {
  content: ''; width: 11px; height: 11px; border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: rotate(45deg); margin-left: 4px;
}
#nav-back.home::before {
  width: 14px; height: 12px; border: 2px solid #fff; border-top: none; transform: none; margin: 6px 0 0;
  border-radius: 0 0 2px 2px;
}
#nav-back.home::after {
  content: ''; position: absolute; width: 13px; height: 13px; border-left: 2px solid #fff; border-top: 2px solid #fff;
  transform: rotate(45deg); top: 13px;
}
.no-nav #nav { display: none; }

/* 页面区域 */
#pages { position: absolute; top: var(--nav-h); left: 0; right: 0; bottom: var(--tab-h); }
.no-nav #pages { top: 0; }
.no-tab #pages { bottom: 0; }
/* transform 让页面内 position: fixed 的底栏相对于页面区域定位 */
.pg { position: absolute; inset: 0; transform: translateZ(0); overflow: hidden; }
.wx-page {
  height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

/* 底部标签栏 */
#tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--tab-h); z-index: 20;
  background: #fff; display: flex; padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -1px 0 rgba(0, 0, 0, 0.05);
}
.no-tab #tabbar { display: none; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: var(--tab-color); }
.tab.on { color: var(--tab-on); }
.tab-ico { position: relative; width: 24px; height: 24px; }
.tab-ico img { width: 24px; height: 24px; display: block; }
.tab-t { font-size: 10px; margin-top: 3px; line-height: 1; }
.badge {
  display: none; position: absolute; left: 16px; top: -4px; min-width: 16px; height: 16px; padding: 0 4px;
  box-sizing: border-box; border-radius: 8px; background: #FA5151; color: #fff; font-size: 11px; line-height: 16px; text-align: center;
}
.badge.show { display: block; }

/* toast */
.toast {
  position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 50;
  background: rgba(17, 17, 17, 0.78); color: #fff; border-radius: 10px; padding: 12px 18px;
  font-size: 15px; max-width: 70%; text-align: center; display: none; pointer-events: none;
}
.toast.show { display: block; }
.toast.icon { min-width: 120px; padding: 22px 16px 16px; }
.toast-i { display: none; width: 22px; height: 12px; border-left: 3px solid #fff; border-bottom: 3px solid #fff; transform: rotate(-45deg); margin: 0 auto 18px; }
.toast.icon .toast-i { display: block; }

/* 小程序基础组件 */
wx-view { display: block; }
wx-text { display: inline; }
wx-scroll-view { display: block; position: relative; }
.wx-sx { overflow-x: auto; overflow-y: hidden; }
.wx-sy { overflow-y: auto; }
.wx-nobar { scrollbar-width: none; }
.wx-nobar::-webkit-scrollbar { display: none; }
product-card, product-visual { display: block; }
input, textarea {
  display: block; border: none; outline: none; background: transparent; padding: 0; margin: 0;
  font: inherit; color: inherit; border-radius: 0; -webkit-appearance: none; appearance: none;
}
input { height: 1.4em; min-height: 1.4em; }
textarea { width: 300px; height: 150px; resize: none; }
input::placeholder, textarea::placeholder { color: #B4BAB6; }
[class*="hover"], wx-view[class] { cursor: default; }

/*__APP_CSS__*/
</style>
</head>
<body>
<div id="app">
  <div id="nav"><div id="nav-back" aria-label="返回"></div><div id="nav-title"></div></div>
  <div id="pages"></div>
  <div id="tabbar"></div>
  <div id="toast" class="toast"><div class="toast-i"></div><div class="toast-t"></div></div>
</div>
<script>/*__BUNDLE__*/</script>
<script>/*__RUNTIME__*/</script>
</body>
</html>
